<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body,
    html {
      height: 100%;
      margin: 0;
    }

    #main {
      position: fixed;
      bottom: 5em;
      width: 100%;
      background-color: black;
      opacity: 0.7;
      color: #ccc;
      padding: 2em;
    }

    a:link,
    a:visited,
    a:hover,
    a:active {
      color: #eee;
    }

    .bg {
      /* The image used */
      background-image: url("ivanpico_bg.jpg");

      /* Full height */
      height: 100%;

      /* Center and scale the image nicely */
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }
  </style>
</head>

<body>

  <div class="bg"></div>

  <div id="main">
    <h1>Ivan Pico Martin</h1>
    <h2>Life and Tech Enthusiasts</h2>
    <hr />
    <p></p>
    <p>&nbsp;<i class="fa fa-link" aria-hidden="true"></i>&nbsp;
      <a href="https://www.linkedin.com/in/ivanpico/">LinkedIn</a> |
      <a href="https://twitter.com/_ivanpico">Twitter</a> |
      <a href="https://instagram.com/ivanpicom">Instagram</a> |
    </p>
  </div>
</body>

</html>
