<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Hiragana</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Estudio de Hiragana</h1>
        <div class="row mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h5 class="card-title">Hiragana</h5>
                                <p class="card-text hiragana-display"></p>
                            </div>
                            <div class="col-md-6"><h5 class="card-title">Traducción</h5>
                                <div class="translation-display"></div>
                            </div>
                        </div>

                        <div class="col-md-12" style="margin-top: 2rem;">
                            <button class="btn btn-primary new-hiragana-btn">Nuevo Hiragana</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Romaji</h5>
                        <input type="text" class="form-control romaji-input" placeholder="Introduce el romaji aquí">
                        <p class="score">Aciertos: 0</p>
                        <button class="btn btn-primary show-answer-btn">Mostrar Respuesta</button>

                        <p class="mt-3 romaji-ok text-success d-none">OK</p>
                        <p class="mt-3 answer-display text-info d-none"></p>
                        <div class="countdown"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-md-12">
                <h5 style="display: inline;">Longitud del hiragana: </h5>
                <input type="number" id="hiragana-length-min" min="1" value="1">
                <span> a </span>
                <input type="number" id="hiragana-length-max" min="1" value="2">
                <input type="checkbox" id="any-length">
                <label for="any-length">Cualquier longitud</label>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-md-12">
                <h5>Selecciona los hiraganas a practicar</h5>
                <div style="margin-bottom: 1rem; display: flex; flex-wrap: wrap;">
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="vocales" id="vocales" checked>
                        <label for="vocales">Vocales</label>
                    </div>
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="k-group" id="k-group" checked>
                        <label for="k-group">K</label>
                    </div>
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="s-group" id="s-group" checked>
                        <label for="s-group">S</label>
                    </div>
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="t-group" id="t-group" checked>
                        <label for="t-group">T</label>
                    </div>
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="n-group" id="n-group">
                        <label for="n-group">N</label>
                    </div>
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="h-group" id="h-group">
                        <label for="h-group">H</label>
                    </div>
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="m-group" id="m-group">
                        <label for="m-group">M</label>
                    </div>
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="y-group" id="y-group">
                        <label for="y-group">Y</label>
                    </div>
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="r-group" id="r-group">
                        <label for="r-group">R</label>
                    </div>
                    <div style="margin-right: 1rem;">
                        <input type="checkbox" value="w-group" id="w-group">
                        <label for="w-group">W</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

                    countdownDisplay.textContent = 'Siguente hiragana en: ' + countdown;

                    if (countdown === 0) {
                        romajiInput.value = '';
                        clearInterval(countdownInterval);
                        romajiOk.classList.add('d-none');
                        answerDisplay.textContent = '';

        // Generar una nueva palabra cuando se carga la página
        window.onload = generateNewHiragana;

        // Generar una nueva palabra cuando se cambia la longitud deseada
        document.getElementById('hiragana-length-min').addEventListener('change', generateNewHiragana);
        document.getElementById('hiragana-length-max').addEventListener('change', generateNewHiragana);
        // Generar una nueva palabra cuando se cambia el estado del checkbox 'any-length'
        document.getElementById('any-length').addEventListener('change', function () {
            console.log('Checkbox state changed');
            var anyLength = this.checked;
            console.log('Any length:', anyLength);
            document.getElementById('hiragana-length-min').disabled = anyLength;
            console.log('Minimum length input disabled:', anyLength);
            document.getElementById('hiragana-length-max').disabled = anyLength;
            console.log('Maximum length input disabled:', anyLength);
            generateNewHiragana();
            console.log('New hiragana generated');
        });

        // Generar una nueva palabra cuando se cambia el grupo de hiragana permitido
        var checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', generateNewHiragana);
        });
    </script>
    </script>
    </script>
